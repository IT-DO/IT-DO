<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Anton Kurishchev — Linux / DevOps engineer, Saint Petersburg, open to work">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1018"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1724"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#58A6FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="100%" stop-color="#30363D" stop-opacity="0"/>
    </linearGradient>
    <filter id="tsh" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="hg" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1f2937" stroke-width="1" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#hbg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#hg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="18" fill="none" stroke="#1f2937"/>


  <!-- accent bar -->
  <rect x="0" y="0" width="5" height="280" rx="2.5" fill="url(#accent)" opacity="0.85"/>

  <!-- kicker -->
  <text x="64" y="96" font-family="'Segoe UI', Arial, sans-serif" font-size="12"
        letter-spacing="3.4" fill="#58A6FF">LINUX / DEVOPS ENGINEER</text>

  <!-- name -->
  <text x="61" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="54"
        font-weight="700" fill="#F0F6FC">Anton Kurishchev</text>

  <!-- status line -->
  <circle cx="67" cy="207" r="4.5" fill="#3FB950"/>
  <text x="81" y="212" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8B949E">Санкт-Петербург · удалённо · <tspan fill="#7EE787">открыт к работе</tspan></text>

  <!-- divider -->
  <rect x="62" y="236" width="420" height="1" fill="url(#fade)"/>

  <!-- terminal -->
  <g transform="translate(690,40)">
    <rect width="450" height="224" rx="12" fill="#0B0F14" stroke="#262D36" filter="url(#tsh)"/>
    <rect width="450" height="34" rx="12" fill="#121820"/>
    <rect y="22" width="450" height="12" fill="#121820"/>
    <circle cx="20" cy="17" r="4.5" fill="#FF5F56"/>
    <circle cx="38" cy="17" r="4.5" fill="#FFBD2E"/>
    <circle cx="56" cy="17" r="4.5" fill="#27C93F"/>
    <text x="76" y="21" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6E7681">infra@n100 — zsh</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
      <text x="20" y="66" fill="#7EE787">$ cat ~/motto</text>
      <text x="20" y="102" fill="#C9D1D9">Инфраструктура должна</text>
      <text x="20" y="128" fill="#C9D1D9">воспроизводиться,</text>
      <text x="20" y="154" fill="#C9D1D9">а не вспоминаться.</text>
      <text x="20" y="196" fill="#7EE787">$</text>
      <rect x="32" y="181" width="9" height="16" fill="#58A6FF" opacity="0.8"/>
    </g>
  </g>
</svg>
